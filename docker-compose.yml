# Production stack for the VPS. Images are built in CI and pulled here -- this
# file never builds, so a deploy is a pull plus a restart and the box never
# needs the ~2GB of toolchain a Next.js build wants.
#
# Copy .env.example to .env on the VPS and fill it in before the first `up`.

name: athena

services:
  backend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-zhong86}/athena-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      # Overrides the .env defaults that only make sense on a laptop.
      SQLITE_PATH: /app/data/athena.db
      LANCEDB_PATH: /app/data/lancedb
      UPLOADS_PATH: /app/data/uploads
      FASTEMBED_CACHE: /app/data/models
      # Container-side landing spot for the bind mount below. HERMES_CONFIG_DIR
      # (the host path) is set in .env; this path is fixed by the mount, so it
      # lives here rather than there.
      HERMES_CONFIG_PATH: /app/.hermes
    ports:
      # Loopback only, not 0.0.0.0 -- lets Hermes (a host process on this same
      # VPS, see the volumes comment below) reach POST /mcp at 127.0.0.1:8000
      # without crossing a network. Binding the public interface instead would
      # put every other route (materials, sessions, goals, quizzes -- none of
      # which sit behind Caddy's basic_auth) directly on the internet; only
      # /connections* is meant to be reachable that way, via Caddy.
      - "127.0.0.1:8000:8000"
    volumes:
      # Everything durable lives here: SQLite, the LanceDB index, original
      # uploads, and the ~130MB ONNX embedding model. Losing this volume means
      # losing every student's materials -- see DEPLOY.md for the backup line.
      - athena-data:/app/data
      # Hermes runs on the VPS host, not in a container. This lets the backend
      # write the credential files Hermes reads directly, so nothing crosses a
      # network -- see app/config.py's note on hermes_config_path.
      - ${HERMES_CONFIG_DIR:?set HERMES_CONFIG_DIR in .env}:/app/.hermes
    extra_hosts:
      # HERMES_BASE_URL in .env should target this, not 127.0.0.1 -- that would
      # mean the container itself, and Hermes is a process on the host.
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      # Generous: the first boot downloads the embedding model before serving.
      start_period: 180s
      retries: 3

  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-zhong86}/athena-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      # Server components only. The browser-facing URL was already baked into
      # the bundle at build time and cannot be changed from here.
      INTERNAL_API_BASE_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      ATHENA_DOMAIN: ${ATHENA_DOMAIN:?set ATHENA_DOMAIN in .env}
      # Gates /api/connections*, the only route that takes a credential.
      # Required, not defaulted: a blank hash makes basic_auth accept nothing,
      # which would silently lock the owner out of connecting Google.
      ATHENA_ADMIN_USER: ${ATHENA_ADMIN_USER:?set ATHENA_ADMIN_USER in .env}
      ATHENA_ADMIN_PASSWORD_HASH: ${ATHENA_ADMIN_PASSWORD_HASH:?run `docker run --rm caddy:2-alpine caddy hash-password` and set ATHENA_ADMIN_PASSWORD_HASH in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Persisting these keeps Let's Encrypt from re-issuing on every restart,
      # which would hit the rate limit fast.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend

volumes:
  athena-data:
  caddy-data:
  caddy-config:
