name: Deploy

# Images are built here rather than on the VPS: a `next build` wants well over
# the RAM a small instance has, and building in CI keeps the box serving while
# the new image is assembled.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A second push while a deploy is mid-flight should supersede it, not race it
  # onto the VPS out of order.
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: backend
            context: ./backend
          - name: frontend
            context: ./frontend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/athena-${{ matrix.name }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # NEXT_PUBLIC_* is compiled into the client bundle, so the public API
          # URL has to be supplied at build time. Harmless for the backend.
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.PUBLIC_API_BASE_URL }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.yml,Caddyfile"
          target: ${{ secrets.VPS_APP_DIR }}

      - name: Pull and restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ${{ secrets.VPS_APP_DIR }}
            echo "${{ secrets.GHCR_TOKEN }}" \
              | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
            docker compose pull
            docker compose up -d
            # Reclaim the superseded image layers; a small disk fills up in a
            # handful of deploys otherwise.
            docker image prune -f

      - name: Verify the deploy is serving
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ${{ secrets.VPS_APP_DIR }}
            # The backend reports "degraded" when migrations are pending, so
            # assert on the body rather than just a 200.
            for i in $(seq 1 30); do
              body=$(docker compose exec -T backend \
                python -c "import urllib.request;print(urllib.request.urlopen('http://localhost:8000/health',timeout=5).read().decode())" 2>/dev/null || true)
              case "$body" in
                *'"status":"ok"'*) echo "healthy: $body"; exit 0 ;;
              esac
              echo "waiting for health ($i/30)..."
              sleep 10
            done
            echo "backend did not become healthy:"
            docker compose logs --tail=50 backend
            exit 1
